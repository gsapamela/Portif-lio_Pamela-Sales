<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <title>Multimídia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="CSS/estilo.css">
    <!-- JavaScript: tema claro/escuro -->
    <script src="js/script.js" defer></script>

</head>

<body>

    <!-- ===== NAVBAR ===== -->
    <header class="navbar">
        <div class="navbar-inner">
            <a href="#topo" class="brand">Portifólio | Pâmela Sales</a>
            <nav class="nav-links">
                <a href="index.html">Início</a>
                <a href="#Video">Video</a>
                <a href="#Audio">Áudio</a>
                <a href="#Iframe">Iframe</a>

                <button
                    id="alternarTema"
                    class="btn-tema"
                    type="button"
                    aria-label="Ativar tema escuro"
                    aria-pressed="false">
                    🌙 Tema escuro
                </button>
                
            </nav>
        </div>
    </header>

    <h1>Multimídia</h1>

<section id="Video" class="hero">
    <div class="hero-inner">
        <h2>Vídeo</h2>
        <video controls width="480" height="270">
            <source src="video.mp4" type="video/mp4">
            Navegador não suporta vídeo
        </video>
    </div>
</section>

<section id="Audio" class="hero">
    <div class="hero-inner">
        <h2>Áudio</h2>
        <audio controls>
            <source src="audio.mp3" type="audio/mpeg">
            Navegador não suporta áudio
        </audio>
    </div>
</section>

<section id="Iframe" class="hero">
    <div class="hero-inner">
        <h3>Vídeo do YouTube</h3>
        <iframe src="https://www.youtube.com/embed/3DcoC8p9az8?si=acPJfejPzfdZcxbw" width="560" height="315" frameborder="0" allowfullscreen>
        </iframe>
    </div>
</section>

</body>

</html>
