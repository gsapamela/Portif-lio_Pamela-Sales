<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimídia | Pâmela Sales</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS (antes do seu CSS) -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        defer></script>

    <!-- JavaScript: tema claro/escuro -->
    <script src="js/scripts.js" defer></script>
</head>

<body id="topo">

    <!-- Link de acessibilidade: aparece ao pressionar Tab -->
    <a class="visually-hidden-focusable" href="#conteudo">Pular para o conteúdo</a>

    <!-- ===== NAVBAR ===== -->
    <header class="navbar">
        <div class="navbar-inner">

            <a href="index.html" class="brand">Portfólio | Pâmela Sales</a>

            <nav class="nav-links" aria-label="Navegação da página de multimídia">
                <a href="index.html">Início</a>
                <a href="#Video">Vídeo</a>
                <a href="#Audio">Áudio</a>
                <a href="#Iframe">Iframe</a>
            </nav>

            <button
                id="alternarTema"
                class="btn-tema"
                type="button"
                aria-pressed="false">
                <span aria-hidden="true">🌙</span> Tema escuro
            </button>

        </div>
    </header>

    <main id="conteudo">

        <h1>Multimídia</h1>

        <section id="Video" class="hero">
            <div class="hero-inner">
                <h2>Vídeo</h2>
                <video controls preload="metadata" width="480" height="270">
                    <source src="video.mp4" type="video/mp4">
                    <!-- Quando tiver o arquivo de legendas, descomente:
                    <track kind="captions" src="legendas.vtt" srclang="pt-BR" label="Português" default>
                    -->
                    Seu navegador não suporta vídeo.
                </video>
            </div>
        </section>

        <section id="Audio" class="hero">
            <div class="hero-inner">
                <h2>Áudio</h2>
                <audio controls preload="metadata">
                    <source src="audio.mp3" type="audio/mpeg">
                    Seu navegador não suporta áudio.
                </audio>
            </div>
        </section>

        <section id="Iframe" class="hero">
            <div class="hero-inner">
                <h2>Vídeo do YouTube</h2>

                <!-- Bootstrap: ratio ratio-16x9 deixa o vídeo responsivo -->
                <div class="ratio ratio-16x9 embed-responsivo">
                    <iframe
                        src="https://www.youtube.com/embed/3DcoC8p9az8?si=acPJfejPzfdZcxbw"
                        title="Vídeo do YouTube incorporado na página"
                        loading="lazy"
                        referrerpolicy="strict-origin-when-cross-origin"
                        allowfullscreen>
                    </iframe>
                </div>
            </div>
        </section>

    </main>

</body>

</html>
