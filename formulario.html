<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <!-- JavaScript: tema claro/escuro -->
    <script src="js/scripts.js" defer></script>
</head>

<body>

    <!-- ===== NAVBAR ===== -->
    <header class="navbar">
        <div class="navbar-inner">
            <a href="#topo" class="brand">Portifólio | Pâmela Sales</a>
            <nav class="nav-links">
                <a href="index.html">Início</a>
                
                <button
                    id="alternarTema"
                    class="btn-tema"
                    type="button"
                    aria-label="Ativar tema escuro"
                    aria-pressed="false">
                    🌙 Tema escuro
                </button>
                
            </nav>
        </div>
    </header>

    <main class="form-page">
        <div class="form-card">
            <h1>Formulário de Cadastro</h1>

            <form>

                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" required minlength="3">
                </div>

                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" required pattern="[0-9]{11}" placeholder="11999999999">
                </div>

                <div class="form-group">
                    <label for="data">Data de Nascimento:</label>
                    <input type="date" id="data" required>
                </div>

                <div class="form-group">
                    <label for="senha">Criar Senha:</label>
                    <input type="password"
                           id="senha"
                           required
                           minlength="8"
                           pattern="(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z0-9\s]).{8,}"
                           title="A senha deve ter no mínimo 8 caracteres, incluindo letras, números e um caractere especial (ex: !@#$%)">
                    <small class="form-hint">Mínimo de 8 caracteres, com letras, números e pelo menos 1 caractere especial (!@#$%*&...)</small>
                </div>

                <div class="form-group">
                    <label for="confirmar-senha">Confirmar Senha:</label>
                    <input type="password" id="confirmar-senha" required minlength="8">
                </div>

                <button type="submit">Cadastrar</button>

            </form>
        </div>
    </main>

</body>

</html>
