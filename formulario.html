
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Usuário | Pâmela Sales</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">

    <script src="js/scripts.js" defer></script>
</head>

<body id="topo" class="pagina-formulario">

    <!-- ===== NAVBAR ===== -->
    <header class="navbar">
        <div class="navbar-inner">

            <a href="index.html" class="brand">
                Portfólio | Pâmela Sales
            </a>

            <div class="navbar-acoes">

                <nav class="nav-links" aria-label="Navegação">
                    <a href="index.html">Início</a>
                </nav>

                <button
                    id="alternarTema"
                    class="btn-tema"
                    type="button"
                    aria-pressed="false">
                    🌙 Tema escuro
                </button>

            </div>
        </div>
    </header>

    <!-- ===== FORMULÁRIO ===== -->
    <main class="form-page">

        <div class="form-card">

            <h1>Formulário de Cadastro</h1>

            <p class="form-descricao">
                Preencha os campos abaixo para realizar
                a validação do cadastro.
            </p>

            <form id="formCadastro" novalidate>

                <!-- Nome -->
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required
                        minlength="3"
                        autocomplete="name">

                    <small class="mensagem-erro" id="erro-nome"></small>
                </div>

                <!-- E-mail -->
                <div class="form-group">
                    <label for="email">E-mail:</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="email">

                    <small class="mensagem-erro" id="erro-email"></small>
                </div>

                <!-- Telefone -->
                <div class="form-group">
                    <label for="telefone">Telefone:</label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        required
                        pattern="[0-9]{11}"
                        placeholder="11999999999"
                        autocomplete="tel">

                    <small class="mensagem-erro" id="erro-telefone"></small>
                </div>

                <!-- Data de nascimento -->
                <div class="form-group">
                    <label for="data">Data de Nascimento:</label>

                    <input
                        type="date"
                        id="data"
                        name="data"
                        required
                        autocomplete="bday">

                    <small class="mensagem-erro" id="erro-data"></small>
                </div>

                <!-- Senha -->
                <div class="form-group">
                    <label for="senha">Criar Senha:</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        required
                        minlength="8"
                        autocomplete="new-password">

                    <small class="form-hint">
                        Mínimo de 8 caracteres, com letras,
                        números e pelo menos um caractere especial.
                    </small>

                    <small class="mensagem-erro" id="erro-senha"></small>
                </div>

                <!-- Confirmação de senha -->
                <div class="form-group">
                    <label for="confirmar-senha">
                        Confirmar Senha:
                    </label>

                    <input
                        type="password"
                        id="confirmar-senha"
                        name="confirmar-senha"
                        required
                        autocomplete="new-password">

                    <small
                        class="mensagem-erro"
                        id="erro-confirmar-senha">
                    </small>
                </div>

                <!-- Feedback visível -->
                <div
                    id="mensagemFormulario"
                    class="mensagem-formulario"
                    role="status"
                    aria-live="polite">
                </div>

                <button type="submit">
                    Validar cadastro
                </button>

            </form>

        </div>

    </main>

</body>
</html>
