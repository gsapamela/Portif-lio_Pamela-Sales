<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráficos | Pâmela Sales</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS (antes do seu CSS) -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        defer></script>

    <!-- JavaScript: tema claro/escuro -->
    <script src="js/scripts.js" defer></script>
</head>

<body id="topo">

    <!-- Link de acessibilidade: aparece ao pressionar Tab -->
    <a class="visually-hidden-focusable" href="#conteudo">Pular para o conteúdo</a>

    <!-- ===== NAVBAR ===== -->
    <header class="navbar">
        <div class="navbar-inner">

            <a href="index.html" class="brand">Portfólio | Pâmela Sales</a>

            <nav class="nav-links" aria-label="Navegação da página de gráficos">
                <a href="index.html">Início</a>
            </nav>

            <button
                id="alternarTema"
                class="btn-tema"
                type="button"
                aria-pressed="false">
                <span aria-hidden="true">🌙</span> Tema escuro
            </button>

        </div>
    </header>

    <main id="conteudo">

        <h1>Gráficos</h1>

        <!-- Bootstrap: d-block, mx-auto, my-4, mw-100, h-auto (canvas centralizado e responsivo) -->
        <canvas
            id="meuCanvas"
            class="d-block mx-auto my-4 mw-100 h-auto"
            width="450"
            height="150"
            role="img"
            aria-label="Desenho com um retângulo azul à esquerda e um círculo vermelho à direita">
            Seu navegador não suporta canvas. O desenho mostra um retângulo
            azul e um círculo vermelho.
        </canvas>

    </main>

    <script>
        const canvas = document.getElementById('meuCanvas');
        const ctx = canvas.getContext('2d');

        /* Retângulo (azul com contraste suficiente sobre o fundo) */
        ctx.fillStyle = "#2980b9";
        ctx.fillRect(40, 40, 150, 80);

        /* Círculo */
        ctx.beginPath();
        ctx.arc(320, 97, 50, 0, Math.PI * 2);
        ctx.fillStyle = "#c0392b";
        ctx.fill();
    </script>

</body>

</html>
